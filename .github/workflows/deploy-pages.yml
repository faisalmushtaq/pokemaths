name: Deploy Pokemaths to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build
        env:
          BASE_PATH: /pokemaths/

      - name: Keep GitHub Pages from rewriting asset paths
        run: touch dist/public/.nojekyll

      - name: Publish the built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/public
          commit_message: Deploy ${{ github.sha }} to GitHub Pages
